services:
  utils:
    build:
      context: .
      dockerfile: utils/Dockerfile
    volumes:
      - ./:/app/
      - ./data:/data
      - venv:/opt/venv
    env_file:
      - dev.env
    depends_on:
      postgres:
        condition: service_healthy

  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bantulex
      POSTGRES_USER: bantulex
      POSTGRES_PASSWORD: bantulex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantulex -d bantulex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Data Management (Crouton admin) ────────────────────────────────────────
  # UI on /admin/, API on /api. Edits the SQLite file data/bantulex.db (see admin/README.md).
  # Behind the "admin" profile so a plain `docker compose up` works without that file:
  #   docker compose --profile admin up -d --build admin   (or: just admin)
  admin:
    build: ./admin
    image: ghcr.io/ghentcdh/bantulex
    profiles: ["admin"]
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      # Must contain bantulex.db and be writable by uid 1000 (SQLite journal files).
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  pgdata:
  venv:
