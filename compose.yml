services:
  # ── Data Management (Kottster) ─────────────────────────────────────────────
  # Primair pre-built container voor beheer, draait op /data/admin
  data-management:
    container_name: bantulex-data-management
    build:
      context: .
      dockerfile: docker/kottster.Dockerfile
      args:
        - KOTTSTER_BASE_PATH=/admin
    volumes:
      - ./kottster:/app
      - /app/node_modules
      - /app/dist
      - ./data:/data
    environment:
      - PORT=5480
      - DEV_API_SERVER_PORT=5481
      - VITE_BASE_PATH=
      - DB_PATH=/data/bantulex.db
      - DEBUG=vite:*
    ports:
      - "5480:5480"
      - "5481:5481"
    user: root
    tty: true
    stdin_open: true
    command: ["sh", "/app/scripts/dev.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5480/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Python Tools (Import/Export CLI) ───────────────────────────────────────
  python-tools:
    container_name: bantulex-python
    build:
      context: .
      dockerfile: docker/python-tools.Dockerfile
    volumes:
      - ./data:/app/data
      - ./import/src:/app/import/src
      - ./export/src:/app/export/src
      - ./local-map/data:/app/local-map/data
      - python-venv:/app/.venv
    env_file:
      - .env
    command: tail -f /dev/null

  # ── Gateway & Data Publishing (Caddy) ──────────────────────────────────────
  gateway:
    image: caddy:2-alpine
    container_name: bantulex-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local-map:/srv/local-map:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      data-management:
        condition: service_healthy
    restart: always

volumes:
  python-venv:
  caddy-data:
  caddy-config:
