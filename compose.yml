services:
  import:
    container_name: bantulex-import
    build:
      context: import/
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
      - ./import:/app
      - import-venv:/app/.venv
    env_file:
      - .env
    command: tail -f /dev/null

  export:
    container_name: bantulex-export
    build:
      context: export/
      dockerfile: Dockerfile
    volumes:
      - ./data:/data
      - ./export:/app
      - export-venv:/app/.venv
    env_file:
      - .env
    command: tail -f /dev/null

  kottster:
    container_name: bantulex-kottster
    build:
      context: kottster
      dockerfile: Dockerfile
    volumes:
      - ./kottster:/app           # source mount voor dev
      - /app/node_modules         # container's node_modules bewaren
      - /app/dist                 # container's dist bewaren (gebouwd in image)
      - ./data:/data
    environment:
      - PORT=5480
      - DEV_API_SERVER_PORT=5481
      - VITE_DOCKER_MODE=true
      - ROOT_USER_PASSWORD=admin
      - DB_PATH=/data/bantulex.db
    ports:
      - "5480:5480"
      - "5481:5481"
    user: root                    # nodig voor file writes tijdens dev
    tty: true
    stdin_open: true
    command: ["sh", "/app/scripts/dev.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5480/bantulex/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  bantulex-map:
    container_name: bantulex-map
    build:
      context: local-map/
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./local-map/data:/usr/share/caddy/data:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: bantulex-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      kottster:
        condition: service_healthy
      bantulex-map:
        condition: service_started
    restart: always

volumes:
  import-venv:
  export-venv:
  caddy-data:
  caddy-config:
