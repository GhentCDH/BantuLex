services:
  utils:
    build:
      context: .
      dockerfile: utils/Dockerfile
    volumes:
      - ./:/app/
      - ./data:/data
      - venv:/opt/venv
    env_file:
      - dev.env

  # ── Data Management (Crouton admin) ────────────────────────────────────────
  # UI on /admin/, API on /api. Edits the SQLite file data/bantulex.db (see admin/README.md).
  # Behind the "admin" profile so a plain `docker compose up` works without that file:
  #   docker compose --profile admin up -d --build admin   (or: just admin)
  admin:
    build: ./admin
    image: ghcr.io/ghentcdh/bantulex
    profiles: ["admin"]
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      # Must contain bantulex.db and be writable by uid 1000 (SQLite journal files).
      - ./data:/app/data
    restart: unless-stopped

  # ── Caddy (website + admin proxy) ──────────────────────────────────────────
  # The public site on /, the admin on /admin/ and /api (502 until `just admin` runs).
  # site/ is the web root; /core and /extensions come from Pihka, as build-site does.
  # Localhost only: the admin behind it has no login.
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:9161:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./vendor/pihka/pihka:/srv/pihka:ro
      # The whole folder, not the file: import and reset-db replace bantulex.db.
      - ./data:/srv/data:ro

volumes:
  venv:
