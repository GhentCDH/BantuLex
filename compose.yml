services:
  utils:
    build:
      context: .
      dockerfile: utils/Dockerfile
    volumes:
      - ./:/app/
      - ./data:/data
      - venv:/opt/venv
    env_file:
      - dev.env
    depends_on:
      postgres:
        condition: service_healthy

  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bantulex
      POSTGRES_USER: bantulex
      POSTGRES_PASSWORD: bantulex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bantulex -d bantulex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Gateway & Data Publishing (Caddy) ──────────────────────────────────────
  gateway:
    image: caddy:2-alpine
    ports:
      - "9160:80"
    volumes:
      - ./caddy/:/etc/caddy/:ro
      - ./local-map:/srv/local-map:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  venv:
