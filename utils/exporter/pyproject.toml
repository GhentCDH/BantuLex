[project]
name = "exporter"
version = "0.1.0"
description = "BantuLex data export"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "utilities",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "sqlmodel>=0.0.27"
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
export-evolex = "exporter.export_evolex:main"
export-map = "exporter.export_map:main"
export-blr = "exporter.export_blr:main"

[tool.uv.sources]
utilities = { path = "../utilities", editable = true }