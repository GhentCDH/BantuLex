# .github/workflows/admin-image.yml
#
# Builds the BantuLex admin (Crouton) container from admin/Dockerfile (default/final stage `runtime`)
# and publishes it as ghcr.io/ghentcdh/bantulex.
#
# Triggers:
#   - push of a tag v*            -> typecheck, then build linux/amd64 + linux/arm64 and push to GHCR
#                                    (tags: 1.2.3, 1.2, 1, latest for non-prerelease tags, sha-<short>)
#   - pull_request / push to main -> typecheck + build-only check (linux/amd64, no login, no push)
#     touching admin/** or this file
#   - workflow_dispatch           -> same as a branch push (build only); to publish, push a v* tag
#
# Required setting (no secrets needed, GITHUB_TOKEN is used):
#   The GHCR package `bantulex` may already exist from an earlier image. Its package settings
#   (github.com/orgs/GhentCDH/packages/container/bantulex/settings -> Manage Actions access) must grant
#   this repository "Write" access, otherwise the push fails with 403 even though the job requests
#   `packages: write`. If the org restricts tokens, also allow write via Settings -> Actions -> General
#   -> Workflow permissions. Unit/e2e tests are not run here: they need a private SQLite database.

name: Admin image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters only apply to branch pushes; tag pushes always run.
    paths:
      - "admin/**"
      - ".github/workflows/admin-image.yml"
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/admin-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR/branch builds, never a release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/ghentcdh/bantulex

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The `dev` stage is the same toolchain image the compose `dev` service uses.
      - name: Build dev toolchain image
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: admin/Dockerfile
          target: dev
          load: true
          tags: bantulex-dev:ci
          cache-from: type=gha,scope=admin-dev
          cache-to: type=gha,scope=admin-dev,mode=max

      # The entrypoint runs `pnpm install --frozen-lockfile` and `pnpm run setup` (Prisma client
      # generation, no database) before the command; node_modules ends up inside the checkout.
      - name: Typecheck backend and frontend
        run: docker run --rm -v "$GITHUB_WORKSPACE/admin:/app" bantulex-dev:ci pnpm typecheck

  build:
    name: Build (no push)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=BantuLex admin
            org.opencontainers.image.description=BantuLex admin: Crouton/NestJS API and Vue UI in one container
            org.opencontainers.image.licenses=MIT

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: admin/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-image
          cache-to: type=gha,scope=admin-image,mode=max

  release:
    name: Build and push
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # better-sqlite3 installs a prebuilt binary per architecture, so arm64 is built under QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=BantuLex admin
            org.opencontainers.image.description=BantuLex admin: Crouton/NestJS API and Vue UI in one container
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./admin
          file: admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-image
          cache-to: type=gha,scope=admin-image,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Pushed ${IMAGE}"
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
